name: Register release

# 打 vX.Y.Z tag 后,把"这个版本已发布"登记进 flow 账本(07_交付流程 §7)。
# 不部署:证据取同一提交上已成功的 main 部署 run(deploy.yml,push 触发)。
# 旧版把项目名写死成 aurya-flow;本模板改用仓库名(标准名,flow 别名可解析)。
# 前提:仓库有 FLOW_SERVICE_TOKEN secret(flow:write 服务令牌,管理员签发)。
on:
  push:
    tags: ['v[0-9]*.[0-9]*.[0-9]*']

jobs:
  register:
    runs-on: aurya
    permissions:
      actions: read
      contents: read
    steps:
      - name: Register
        env:
          GH_TOKEN: ${{ github.token }}
          FLOW_TOKEN: ${{ secrets.FLOW_SERVICE_TOKEN }}
          TAG: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
          PROJECT: ${{ github.event.repository.name }}
        run: |
          set -euo pipefail
          if [ -z "${FLOW_TOKEN:-}" ]; then
            echo "::error::缺少 FLOW_SERVICE_TOKEN,无法登记发布"
            exit 1
          fi
          RUN_ID=$(curl -sS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$REPO/actions/workflows/deploy.yml/runs?head_sha=$SHA&event=push&status=success&per_page=1" | grep -o '"id": *[0-9]*' | head -1 | grep -o '[0-9]*$' || true)
          # tag/sha/run id 均为受限字符(semver / 十六进制 / 数字),可直接拼 JSON
          if [ -n "$RUN_ID" ]; then
            BODY=$(printf '{"tag":"%s","sha":"%s","outcome":"success","runId":"%s","runUrl":"https://github.com/%s/actions/runs/%s"}' "$TAG" "$SHA" "$RUN_ID" "$REPO" "$RUN_ID")
          else
            echo "::warning::$SHA 上没有成功的 main 部署 run,按未核验登记"
            BODY=$(printf '{"tag":"%s","sha":"%s","outcome":"success"}' "$TAG" "$SHA")
          fi
          CODE=$(curl -sS -o resp.json -w '%{http_code}' -X POST "https://flow.aurya.cc/v1/projects/$PROJECT/releases" \
            -H "Authorization: Bearer $FLOW_TOKEN" -H 'Content-Type: application/json' -d "$BODY")
          echo "flow 返回 $CODE"; head -c 600 resp.json; echo
          case "$CODE" in 2??) ;; 409) echo "该 tag 已登记,跳过" ;; *) exit 1 ;; esac
