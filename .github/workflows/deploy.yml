name: Deploy ui-planner

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  pull_request:            # 只跑 test,不部署
  workflow_dispatch:
    inputs:
      ref:
        description: '目标 tag 或提交(留空 = origin/main)'
        required: false
        default: ''
      reason:
        description: '回退原因(回退时必填)'
        required: false
        default: ''

concurrency:
  group: deploy-ui-planner
  cancel-in-progress: false

# 触发参数先绑成环境变量,脚本里只引用 $VAR:
# 直接把 ${{ }} 拼进 shell 会被注入命令(分支名、回退原因都是外部可控输入)
env:
  EVENT_NAME: ${{ github.event_name }}
  HEAD_REF: ${{ github.head_ref }}
  INPUT_REF: ${{ inputs.ref }}
  INPUT_REASON: ${{ inputs.reason }}

jobs:
  test:
    runs-on: ubuntu-latest
    if: github.actor == 'pxMan79'
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Test
        run: pnpm test

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.actor == 'pxMan79'
    runs-on: aurya
    steps:
      - name: Deploy
        run: |
          set -euo pipefail
          cd /opt/projects/ui-planner
          git fetch --all --tags --prune
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ -n "$INPUT_REF" ]; then
            git checkout --detach "$INPUT_REF"
          else
            git reset --hard origin/main
          fi
          SHA=$(git rev-parse --short HEAD)
          echo "deployed: $SHA  reason: $INPUT_REASON"
          docker compose -f docker/ui-planner/docker-compose.yml build
          for img in $(docker compose -f docker/ui-planner/docker-compose.yml config --images); do
            docker tag "$img" "${img%:*}:$SHA" 2>/dev/null || true
            echo "image tagged: ${img%:*}:$SHA"
          done
          docker compose -f docker/ui-planner/docker-compose.yml up -d --remove-orphans
          docker ps --filter name=ui-planner
