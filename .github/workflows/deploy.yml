name: Deploy ui-planner

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  pull_request:            # 只跑 test,不部署
  workflow_dispatch:
    inputs:
      ref:
        description: '目标 tag 或提交(留空 = origin/main)'
        required: false
        default: ''
      reason:
        description: '回退原因(回退时必填)'
        required: false
        default: ''

concurrency:
  group: deploy-ui-planner
  cancel-in-progress: false

# 触发参数先绑成环境变量,脚本里只引用 $VAR:
# 直接把 ${{ }} 拼进 shell 会被注入命令(分支名、回退原因都是外部可控输入)
env:
  EVENT_NAME: ${{ github.event_name }}
  HEAD_REF: ${{ github.head_ref }}
  INPUT_REF: ${{ inputs.ref }}
  INPUT_REASON: ${{ inputs.reason }}

jobs:
  test:
    runs-on: ubuntu-latest
    if: github.actor == 'pxMan79'
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Test
        run: pnpm test

  # 硬门:直推 main 的代码不部署(私有仓当前计划开不了 branch protection,用部署门兜底)。
  # 只改 *.md / docs 的推送已经被上面的 paths-ignore 挡在 workflow 外;能走到这里的必须是已合并 PR。
  guard:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: 提交必须关联已合并 PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # 合并后「PR ↔ 提交」的关联有几秒索引延迟,重试 60 秒再判失败
          for i in $(seq 1 20); do
            body=$(curl -sS -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" || true)
            if printf '%s' "$body" | grep -q '"merged_at": *"[0-9]'; then
              echo "已关联已合并 PR"; exit 0
            fi
            sleep 3
          done
          echo "::error::$GITHUB_SHA 没有关联的已合并 PR。代码改动必须走 PR;直接推 main 不会再部署。"
          printf '%s' "$body" | head -c 300; echo
          exit 1

  deploy:
    needs: [test, guard]
    if: github.event_name != 'pull_request' && github.actor == 'pxMan79' && (needs.guard.result == 'success' || needs.guard.result == 'skipped')
    runs-on: aurya
    steps:
      - name: Deploy
        run: |
          set -euo pipefail
          cd /opt/projects/ui-planner
          git fetch --all --tags --prune
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ -n "$INPUT_REF" ]; then
            git checkout --detach "$INPUT_REF"
          else
            git reset --hard origin/main
          fi
          SHA=$(git rev-parse --short HEAD)
          echo "deployed: $SHA  reason: $INPUT_REASON"
          docker compose -f docker/ui-planner/docker-compose.yml build
          for img in $(docker compose -f docker/ui-planner/docker-compose.yml config --images); do
            docker tag "$img" "${img%:*}:$SHA" 2>/dev/null || true
            echo "image tagged: ${img%:*}:$SHA"
          done
          docker compose -f docker/ui-planner/docker-compose.yml up -d --remove-orphans
          docker ps --filter name=ui-planner
