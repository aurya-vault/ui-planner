name: ui-planner

services:
  ui-planner:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: pxman/ui-planner:latest
    container_name: ui-planner
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 3000
    expose:
      - "3000"
    volumes:
      - ../../data:/app/data
    networks:
      default:
      npm-net:
        aliases:
          - ui-planner

networks:
  npm-net:
    external: true
    name: nginx-proxy-manager_npm-net
